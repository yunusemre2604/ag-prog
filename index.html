<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSM 451 – Ağ Programlama | Ders Konu Anlatımı ve Vize Rehberi</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- KaTeX for Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <!-- Highlight.js for C/Java Code -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-sidebar: #0f172a;
      --text-sidebar: #cbd5e1;
      --text-sidebar-active: #ffffff;
      --bg-sidebar-active: #1e293b;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --code-bg: #f1f5f9;
      --code-text: #0f172a;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
      --tip-bg: #f0fdf4;
      --tip-border: #16a34a;
      --tip-title: #15803d;
      --imp-bg: #eff6ff;
      --imp-border: #2563eb;
      --imp-title: #1d4ed8;
    }

    [data-theme="dark"] {
      --bg-body: #0b0f19;
      --bg-surface: #111827;
      --bg-sidebar: #070a12;
      --text-sidebar: #94a3b8;
      --text-sidebar-active: #ffffff;
      --bg-sidebar-active: #1e293b;
      --accent: #3b82f6;
      --accent-soft: #1e3a8a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1f2937;
      --code-bg: #1e293b;
      --code-text: #e2e8f0;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
      --tip-bg: rgba(22, 163, 74, 0.12);
      --tip-border: #22c55e;
      --tip-title: #4ade80;
      --imp-bg: rgba(37, 99, 235, 0.14);
      --imp-border: #3b82f6;
      --imp-title: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.65;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background-color: var(--bg-sidebar);
      color: var(--text-sidebar);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 100;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 20px 18px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .course-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    .sidebar-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .sidebar-controls {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .search-input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.1);
    }

    .toolbar-btns {
      display: flex;
      gap: 8px;
    }

    .btn-tool {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 28px;
    }

    .nav-list::-webkit-scrollbar {
      width: 6px;
    }
    .nav-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .nav-item-h1 {
      display: block;
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item-h1:first-child {
      margin-top: 0;
    }

    .nav-item-h2 {
      display: block;
      padding: 5px 10px 5px 20px;
      font-size: 12.2px;
      font-weight: 500;
      color: var(--text-sidebar);
      text-decoration: none;
      border-radius: 6px;
      border-left: 2px solid rgba(255, 255, 255, 0.08);
      margin-left: 8px;
      transition: all 0.15s;
    }

    .nav-item-h1:hover, .nav-item-h2:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
    }

    .nav-active {
      background: rgba(37, 99, 235, 0.25) !important;
      color: #60a5fa !important;
      border-left-color: #3b82f6 !important;
    }

    /* Main Content */
    .main-wrapper {
      flex: 1;
      margin-left: 320px;
      padding: 36px 48px 80px;
      max-width: 1140px;
    }

    .content-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 44px 52px;
      box-shadow: var(--shadow);
    }

    /* Typography */
    .markdown-body h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      margin: 44px 0 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent);
      scroll-margin-top: 24px;
    }

    .markdown-body h1:first-child {
      margin-top: 0;
      font-size: 30px;
    }

    .markdown-body h2 {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      margin: 30px 0 12px;
      padding: 8px 14px;
      background: var(--code-bg);
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      scroll-margin-top: 24px;
    }

    .markdown-body p {
      margin: 10px 0;
      font-size: 15px;
    }

    .markdown-body ul, .markdown-body ol {
      margin: 10px 0 14px 24px;
    }

    .markdown-body li {
      margin: 5px 0;
      font-size: 15px;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    .markdown-body a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    /* Inline code & Pre */
    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.2px;
      background: var(--code-bg);
      color: var(--code-text);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
    }

    .markdown-body pre {
      margin: 16px 0;
      border-radius: 10px;
      overflow-x: auto;
      background: #0d1117;
      padding: 16px 20px;
      border: 1px solid #30363d;
    }

    .markdown-body pre code {
      background: transparent;
      color: #e6edf3;
      padding: 0;
      border: none;
      font-size: 13.2px;
      line-height: 1.55;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      margin: 16px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.8px;
    }

    .markdown-body th {
      background: #1e293b;
      color: #ffffff;
      font-weight: 700;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .markdown-body tr:nth-child(even) td {
      background: rgba(148, 163, 184, 0.05);
    }

    /* Slide Images */
    .slide-figure {
      margin: 18px 0;
      text-align: center;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .slide-figure img {
      max-width: 100%;
      height: auto;
      max-height: 460px;
      border-radius: 8px;
      cursor: zoom-in;
      transition: transform 0.15s ease;
      display: block;
      margin: 0 auto;
    }

    .slide-figure img:hover {
      transform: scale(1.01);
    }

    .slide-caption {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Callout / Alert Boxes */
    .callout {
      margin: 18px 0;
      padding: 14px 18px;
      border-radius: 10px;
      border-left: 5px solid var(--imp-border);
      background: var(--imp-bg);
    }

    .callout-tip {
      border-left-color: var(--tip-border);
      background: var(--tip-bg);
    }

    .callout-title {
      font-size: 13.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--imp-title);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .callout-tip .callout-title {
      color: var(--tip-title);
    }

    /* Quiz & Accordion Details */
    .markdown-body details {
      margin: 10px 0 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--code-bg);
      padding: 10px 16px;
      transition: all 0.2s ease;
    }

    .markdown-body details[open] {
      background: var(--bg-surface);
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.08);
    }

    .markdown-body summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 13.8px;
      color: var(--accent);
      outline: none;
      user-select: none;
      padding: 4px 0;
    }

    .markdown-body summary:hover {
      text-decoration: underline;
    }

    .markdown-body details p {
      margin-top: 10px;
    }

    .markdown-body blockquote {
      margin: 14px 0;
      padding: 12px 18px;
      border-left: 4px solid var(--accent);
      background: var(--code-bg);
      border-radius: 0 8px 8px 0;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 92vh;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Mobile Toggle */
    .mobile-menu-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      cursor: pointer;
    }

    @media (max-width: 960px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main-wrapper {
        margin-left: 0;
        padding: 20px 16px 80px;
      }
      .content-card {
        padding: 24px 18px;
      }
      .mobile-menu-btn {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Sol Sabit Ders Menüsü -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="course-badge">Sakarya Üniversitesi</span>
      <div class="sidebar-title">BSM 451 – Ağ Programlama</div>
      <div class="sidebar-sub">Ders Konu Anlatımı & Vize Rehberi</div>
    </div>

    <div class="sidebar-controls">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Konu veya başlık ara..." />
      <div class="toolbar-btns">
        <button class="btn-tool" id="themeBtn" type="button">🌙 Gece Modu</button>
        <a class="btn-tool" href="https://github.com/yunusemre2604/ag-prog/tree/main/0-Katman2-3%20Kodlar" target="_blank" rel="noopener">💻 C Kodları</a>
      </div>
    </div>

    <nav class="nav-list" id="tocNav">
      <div style="padding: 14px; font-size: 13px; color: #94a3b8;">İçindekiler yükleniyor...</div>
    </nav>
  </aside>

  <!-- Ana Ders İçeriği -->
  <main class="main-wrapper">
    <article class="content-card markdown-body" id="contentArea">
      <p style="color: var(--text-muted);">Ders notları yükleniyor...</p>
    </article>
  </main>

  <!-- Mobil Menü Butonu -->
  <button class="mobile-menu-btn" id="mobileMenuBtn">☰ Ders Menüsü</button>

  <!-- Görsel Büyütme (Lightbox) -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="Slayt Görseli" />
  </div>

  <!-- Kütüphaneler -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <script>
    // Gece / Gündüz Modu
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('bsm451_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☀️ Gündüz Modu' : '🌙 Gece Modu';

    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('bsm451_theme', next);
      themeBtn.textContent = next === 'dark' ? '☀️ Gündüz Modu' : '🌙 Gece Modu';
    });

    // Mobil menü
    const sidebar = document.getElementById('sidebar');
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Türkçe uyumlu başlık ID üretici
    function slugify(text) {
      return text
        .toLowerCase()
        .replace(/[^\w\sğüşıöçĞÜŞİÖÇ-]/g, '')
        .trim()
        .replace(/\s+/g, '-');
    }

    async function loadCourseContent() {
      try {
        const res = await fetch('./README.md');
        let md = await res.text();

        // Markdown içindeki statik "## 📑 İçindekiler" bölümünü kaldır (Sol menüde zaten canlı var)
        md = md.replace(/## 📑 İçindekiler[\s\S]*?---\n/, '');

        // Matematik ifadelerini ($$...$$ ve $...$) koru
        const mathBlocks = [];
        md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
          const id = `@@MATH_BLOCK_${mathBlocks.length}@@`;
          mathBlocks.push({ tex: tex.trim(), display: true });
          return id;
        });
        md = md.replace(/\$([^\$\n]+?)\$/g, (_, tex) => {
          const id = `@@MATH_INLINE_${mathBlocks.length}@@`;
          mathBlocks.push({ tex: tex.trim(), display: false });
          return id;
        });

        // Markdown -> HTML
        let html = marked.parse(md);

        // Matematik ifadelerini KaTeX ile geri yerleştir
        html = html.replace(/@@MATH_(BLOCK|INLINE)_(\d+)@@/g, (_, type, idx) => {
          const item = mathBlocks[Number(idx)];
          try {
            return katex.renderToString(item.tex, {
              displayMode: item.display,
              throwOnError: false
            });
          } catch (e) {
            return `<code>${item.tex}</code>`;
          }
        });

        const contentArea = document.getElementById('contentArea');
        contentArea.innerHTML = html;

        // GitHub Alert kutularını ([!IMPORTANT], [!TIP]) şık Callout bileşenine dönüştür
        contentArea.querySelectorAll('blockquote').forEach(bq => {
          const raw = bq.innerHTML.trim();
          if (raw.includes('[!IMPORTANT]')) {
            const div = document.createElement('div');
            div.className = 'callout';
            div.innerHTML = `<div class="callout-title">📌 Önemli Sınav Notu</div>` +
              raw.replace(/\[!IMPORTANT\]\s*/g, '');
            bq.replaceWith(div);
          } else if (raw.includes('[!TIP]')) {
            const div = document.createElement('div');
            div.className = 'callout callout-tip';
            div.innerHTML = `<div class="callout-title">💡 Sayısal Çözüm ve İpucu</div>` +
              raw.replace(/\[!TIP\]\s*/g, '');
            bq.replaceWith(div);
          }
        });

        // Tabloları yatay kaydırılabilir kutuya al
        contentArea.querySelectorAll('table').forEach(tbl => {
          const wrap = document.createElement('div');
          wrap.className = 'table-wrap';
          tbl.parentNode.insertBefore(wrap, tbl);
          wrap.appendChild(tbl);
        });

        // C Kodu linklerini doğrudan GitHub kod satırlarına yönlendir
        contentArea.querySelectorAll('a').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (href.startsWith('./0-Katman2-3')) {
            a.setAttribute('href', 'https://github.com/yunusemre2604/ag-prog/blob/main/' + href.slice(2));
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noopener');
          }
        });

        // Slayt görsellerini Figure kutusuna al ve tıklayınca büyüt (Lightbox)
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        contentArea.querySelectorAll('img').forEach(img => {
          const fig = document.createElement('figure');
          fig.className = 'slide-figure';
          const cap = document.createElement('figcaption');
          cap.className = 'slide-caption';
          cap.textContent = '🖼️ ' + (img.alt || 'Slayt Görseli') + ' (Büyütmek için tıklayın)';
          img.parentNode.insertBefore(fig, img);
          fig.appendChild(img);
          fig.appendChild(cap);

          img.addEventListener('click', () => {
            lightboxImg.src = img.src;
            lightbox.classList.add('open');
          });
        });

        lightbox.addEventListener('click', () => {
          lightbox.classList.remove('open');
        });

        // Kod renklendirme
        contentArea.querySelectorAll('pre code').forEach(block => {
          hljs.highlightElement(block);
        });

        // Sol Menü (İçindekiler) Oluştur
        const tocNav = document.getElementById('tocNav');
        tocNav.innerHTML = '';
        const headings = contentArea.querySelectorAll('h1, h2');
        const tocLinks = [];

        headings.forEach((h, index) => {
          if (index === 0) return; // En üstteki ana sayfa başlığını atla
          const id = slugify(h.textContent) + '-' + index;
          h.id = id;
          const link = document.createElement('a');
          link.href = '#' + id;
          link.textContent = h.textContent;
          link.className = h.tagName === 'H1' ? 'nav-item-h1' : 'nav-item-h2';
          link.addEventListener('click', () => {
            sidebar.classList.remove('open');
          });
          tocNav.appendChild(link);
          tocLinks.push({ id, link, el: h, text: h.textContent.toLowerCase() });
        });

        // Arama kutusu filtreleme
        document.getElementById('searchInput').addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase().trim();
          tocLinks.forEach(item => {
            item.link.style.display = (!q || item.text.includes(q)) ? 'block' : 'none';
          });
        });

        // ScrollSpy (Kaydırdıkça sol menüde aktif başlığı işaretle)
        window.addEventListener('scroll', () => {
          let currentId = '';
          const scrollPos = window.scrollY + 120;
          for (const item of tocLinks) {
            if (item.el.offsetTop <= scrollPos) {
              currentId = item.id;
            }
          }
          tocLinks.forEach(item => {
            item.link.classList.toggle('nav-active', item.id === currentId);
          });
        });

      } catch (err) {
        document.getElementById('contentArea').innerHTML =
          `<p style="color:red;">İçerik yüklenirken hata oluştu: ${err.message}</p>`;
      }
    }

    loadCourseContent();
  </script>
</body>
</html>
